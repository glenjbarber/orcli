name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PAM development files
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # The terminal layer names ioctl requests that differ between the BSD
      # family and System V. A change there breaks a platform that is not the
      # one running the tests, so every supported target is compiled here.
      - name: Cross-compile
        run: make crossbuild
